<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="100%" height="100%" fill="#0b1220" />
  <rect x="60" y="60" width="1080" height="580" rx="20" fill="#0f1724" stroke="#ffffff10" />
  <text x="120" y="150" fill="#9aa7b6" font-family="Arial, Helvetica, sans-serif" font-size="20">LT Timer</text>
